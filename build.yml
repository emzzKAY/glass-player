name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libayatana-appindicator3-dev gstreamer1.0-plugins-good gstreamer1.0-libav
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: glass-player-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**/*
