<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Player</title>
<style>
:root{
  --bg1:#dfe9ff;--bg2:#f6e4f5;--o1:#7fe6e0;--o2:#b7a0ff;--o3:#ffa8c5;
  --glass:rgba(255,255,255,.42);--glass2:rgba(255,255,255,.28);--edge:rgba(255,255,255,.75);
  --text:#17203a;--muted:#55607e;--accent:#4b6bff;--accent-ink:#fff;--shadow:rgba(60,70,130,.18);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#0b1226;--bg2:#1a1030;--o1:#12877f;--o2:#5a3fd0;--o3:#b3366a;
    --glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.06);--edge:rgba(255,255,255,.22);
    --text:#eef1ff;--muted:#a3abc9;--accent:#7fe6e0;--accent-ink:#06201f;--shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg1:#0b1226;--bg2:#1a1030;--o1:#12877f;--o2:#5a3fd0;--o3:#b3366a;
  --glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.06);--edge:rgba(255,255,255,.22);
  --text:#eef1ff;--muted:#a3abc9;--accent:#7fe6e0;--accent-ink:#06201f;--shadow:rgba(0,0,0,.4);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font:15px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2));position:relative;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.75;pointer-events:none;z-index:0}
.orb.a{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:var(--o1)}
.orb.b{width:42vmax;height:42vmax;right:-12vmax;top:20vmax;background:var(--o2)}
.orb.c{width:36vmax;height:36vmax;left:18vmax;bottom:-16vmax;background:var(--o3)}
main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:20px 16px 28px;display:grid;gap:16px;
  grid-template-columns:minmax(0,1fr);}
@media(min-width:760px){main{grid-template-columns:320px minmax(0,1fr);align-items:start;padding-top:40px}}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:26px;
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  box-shadow:0 10px 30px var(--shadow),inset 0 1px 0 var(--edge)}
.now{padding:22px;display:grid;gap:16px;justify-items:center;text-align:center}
.disc{--h:210;width:170px;height:170px;border-radius:50%;position:relative;
  background:conic-gradient(from 20deg,hsl(var(--h) 85% 68%),hsl(calc(var(--h) + 70) 85% 70%),hsl(calc(var(--h) + 140) 80% 66%),hsl(var(--h) 85% 68%));
  box-shadow:0 12px 28px var(--shadow),inset 0 0 0 6px var(--glass2);transition:background .3s}
.disc::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.disc.on{animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.disc.on{animation:none}}
.title{font-size:18px;font-weight:650;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.bar{width:100%;display:grid;gap:4px}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;
  background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--glass2) var(--p,0%));border:1px solid var(--edge)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--glass2);border:1px solid var(--edge)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;
  background:#fff;border:2px solid var(--accent);box-shadow:0 2px 6px var(--shadow)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.ctl{display:flex;align-items:center;justify-content:center;gap:8px}
button{font:inherit;color:var(--text);cursor:pointer;border:1px solid var(--edge);background:var(--glass2);
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding:0;transition:transform .12s,background .12s}
button:hover{background:var(--glass)}button:active{transform:scale(.93)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button svg{width:20px;height:20px;fill:currentColor}
button.play{width:58px;height:58px;background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 16px var(--shadow)}
button.play svg{width:26px;height:26px}
button.tog[aria-pressed=true]{color:var(--accent);background:var(--glass)}
.vol{display:flex;align-items:center;gap:8px;width:100%;color:var(--muted)}
.vol svg{width:18px;height:18px;fill:currentColor;flex:none}
.list{padding:10px;min-height:200px}
.head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 10px;gap:8px}
.head h2{margin:0;font-size:16px}
.add{width:auto;height:36px;border-radius:18px;padding:0 16px;font-size:14px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-color:transparent}
.add:hover{background:var(--accent)}
ul{list-style:none;margin:0;padding:0;max-height:min(52vh,460px);overflow-y:auto;overflow-x:hidden}
li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:16px;cursor:pointer;min-width:0}
li:hover{background:var(--glass2)}
li.cur{background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge)}
li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li.cur .n{font-weight:650}
li .x{width:28px;height:28px;border:none;background:transparent;color:var(--muted);flex:none}
li .x svg{width:14px;height:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.4;flex:none}
li.cur .dot{background:var(--accent);opacity:1}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.drop main::after{content:""}
body.drag .list{outline:2px dashed var(--accent);outline-offset:-6px}
.hint{grid-column:1/-1;text-align:center;color:var(--muted);font-size:12px}
.theme{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:2;width:36px;height:36px}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
<button class="theme" id="theme" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.4A6 6 0 0 1 13.400 3.100 9 9 0 0 0 12 3z"/></svg></button>
<main>
  <section class="glass now" aria-label="Now playing">
    <div class="disc" id="disc"></div>
    <div style="width:100%;min-width:0">
      <div class="title" id="title">Nothing playing</div>
      <div class="sub" id="sub">Add some music to begin</div>
    </div>
    <div class="bar">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek" disabled>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="ctl">
      <button class="tog" id="shuf" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.600l-3 4 3 4H17v-3l4 4-4 4v-3h-3.400L10 14l-3.200 4H3v-2h3.100l3.200-4-3.200-4H3V6h4l3 4 3.200-4H17V3z"/></svg></button>
      <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.500 12L18 6v12z"/></svg></button>
      <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24"><path id="pp" d="M8 5v14l11-7z"/></svg></button>
      <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.500 6z"/></svg></button>
      <button class="tog" id="rep" aria-label="Repeat off" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><text id="one" x="12" y="15" font-size="7" text-anchor="middle" font-weight="700" fill="currentColor" style="display:none">1</text></svg></button>
    </div>
    <div class="vol">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.500 3A4.500 4.500 0 0 0 14 8v8a4.500 4.500 0 0 0 2.500-4z"/></svg>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </section>

  <section class="glass list" aria-label="Playlist">
    <div class="head">
      <h2 id="count">Playlist</h2>
      <button class="add" id="add">Add files</button>
    </div>
    <ul id="ul"></ul>
    <div class="empty" id="empty"><b>Drop audio files here</b>or choose them with Add files. Nothing is uploaded.</div>
  </section>
  <p class="hint">Space plays or pauses. Arrow keys skip and seek. Shuffle and repeat are under the disc.</p>
</main>
<input type="file" id="file" accept="audio/*" multiple hidden>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var a=new Audio();a.preload="metadata";
  var tracks=[],cur=-1,shuffle=false,rep=0,seeking=false;
  var ICON_PLAY="M8 5v14l11-7z",ICON_PAUSE="M6 5h4v14H6zM14 5h4v14h-4z";
  var X='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.300 5.700L12 12l6.300 6.300-1.400 1.400L10.600 13.400 4.300 19.700 2.900 18.300 9.200 12 2.900 5.700 4.300 4.300l6.300 6.300 6.300-6.300z"/></svg>';

  function fmt(s){if(!isFinite(s))return"0:00";var m=Math.floor(s/60),r=Math.floor(s%60);return m+":"+(r<10?"0":"")+r}
  function clean(n){return n.replace(/\.[^.]+$/,"").replace(/[_]+/g," ")}
  function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
  function fill(el){el.style.setProperty("--p",(el.value-el.min)/(el.max-el.min)*100+"%")}

  function add(files){
    var first=tracks.length;
    for(var i=0;i<files.length;i++){
      var f=files[i];
      if(!(f.type.indexOf("audio")===0||/\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|weba)$/i.test(f.name)))continue;
      tracks.push({name:clean(f.name),url:URL.createObjectURL(f)});
    }
    if(tracks.length>first){render();if(cur<0)load(first,true)}
  }

  function load(i,play){
    if(i<0||i>=tracks.length)return;
    cur=i;var t=tracks[i];
    a.src=t.url;
    $("title").textContent=t.name;
    $("sub").textContent="Track "+(i+1)+" of "+tracks.length;
    $("disc").style.setProperty("--h",hue(t.name));
    $("seek").disabled=false;
    document.title=t.name+" · Glass Player";
    render();
    if(play)a.play().catch(function(){});
    if("mediaSession" in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:"Glass Player"})}
  }

  function pick(auto){
    var n=tracks.length;if(!n)return -1;
    if(shuffle&&n>1){var r;do{r=Math.floor(Math.random()*n)}while(r===cur);return r}
    var nx=cur+1;
    if(nx>=n){return(rep===1||!auto)?0:-1}
    return nx;
  }
  function next(auto){
    if(auto&&rep===2){a.currentTime=0;a.play().catch(function(){});return}
    var i=pick(auto);
    if(i<0){a.pause();a.currentTime=0;return}
    load(i,true);
  }
  function prev(){
    if(a.currentTime>3||tracks.length<2){a.currentTime=0;return}
    load((cur-1+tracks.length)%tracks.length,true);
  }
  function toggle(){
    if(cur<0){$("file").click();return}
    if(a.paused)a.play().catch(function(){});else a.pause();
  }
  function remove(i){
    URL.revokeObjectURL(tracks[i].url);
    var wasCur=i===cur;
    tracks.splice(i,1);
    if(!tracks.length){
      a.pause();a.removeAttribute("src");a.load();cur=-1;
      $("title").textContent="Nothing playing";$("sub").textContent="Add some music to begin";
      $("seek").value=0;fill($("seek"));$("seek").disabled=true;$("cur").textContent=$("dur").textContent="0:00";
      document.title="Glass Player";
    }else if(wasCur){load(Math.min(i,tracks.length-1),!a.paused)}
    else if(i<cur){cur--;$("sub").textContent="Track "+(cur+1)+" of "+tracks.length}
    render();
  }

  function render(){
    var ul=$("ul");ul.textContent="";
    var frag=document.createDocumentFragment();
    tracks.forEach(function(t,i){
      var li=document.createElement("li");li.dataset.i=i;if(i===cur)li.className="cur";
      var d=document.createElement("span");d.className="dot";
      var n=document.createElement("span");n.className="n";n.textContent=t.name;
      var x=document.createElement("button");x.className="x";x.setAttribute("aria-label","Remove "+t.name);x.innerHTML=X;
      li.appendChild(d);li.appendChild(n);li.appendChild(x);frag.appendChild(li);
    });
    ul.appendChild(frag);
    $("empty").style.display=tracks.length?"none":"block";
    $("count").textContent=tracks.length?"Playlist ("+tracks.length+")":"Playlist";
    var c=ul.querySelector(".cur");if(c&&c.scrollIntoView)c.scrollIntoView({block:"nearest"});
  }

  $("ul").addEventListener("click",function(e){
    var li=e.target.closest("li");if(!li)return;
    var i=+li.dataset.i;
    if(e.target.closest(".x")){remove(i)}else if(i===cur){toggle()}else{load(i,true)}
  });
  $("add").onclick=function(){$("file").click()};
  $("file").onchange=function(e){add(e.target.files);e.target.value=""};
  $("play").onclick=toggle;$("next").onclick=function(){next(false)};$("prev").onclick=prev;
  $("shuf").onclick=function(){shuffle=!shuffle;this.setAttribute("aria-pressed",shuffle)};
  $("rep").onclick=function(){
    rep=(rep+1)%3;
    this.setAttribute("aria-pressed",rep>0);
    this.setAttribute("aria-label",["Repeat off","Repeat all","Repeat one"][rep]);
    $("one").style.display=rep===2?"block":"none";
  };

  a.addEventListener("play",function(){$("pp").setAttribute("d",ICON_PAUSE);$("play").setAttribute("aria-label","Pause");$("disc").classList.add("on")});
  a.addEventListener("pause",function(){$("pp").setAttribute("d",ICON_PLAY);$("play").setAttribute("aria-label","Play");$("disc").classList.remove("on")});
  a.addEventListener("ended",function(){next(true)});
  a.addEventListener("loadedmetadata",function(){$("dur").textContent=fmt(a.duration)});
  a.addEventListener("timeupdate",function(){
    if(seeking||!a.duration)return;
    var s=$("seek");s.value=a.currentTime/a.duration*1000;fill(s);$("cur").textContent=fmt(a.currentTime);
  });
  a.addEventListener("error",function(){if(tracks.length>1)$("sub").textContent="Can’t play this file, skipping"; if(tracks.length>1)setTimeout(function(){next(true)},700)});

  var s=$("seek");
  s.addEventListener("input",function(){seeking=true;fill(s);if(a.duration)$("cur").textContent=fmt(s.value/1000*a.duration)});
  s.addEventListener("change",function(){if(a.duration)a.currentTime=s.value/1000*a.duration;seeking=false});
  var v=$("vol");
  function setVol(){a.volume=v.value/100;fill(v)}
  v.addEventListener("input",setVol);setVol();

  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT"&&e.target.type==="range"&&(e.key==="ArrowLeft"||e.key==="ArrowRight"||e.key==="ArrowUp"||e.key==="ArrowDown"))return;
    if(e.target.tagName==="BUTTON"&&e.key===" ")return;
    if(e.key===" "){e.preventDefault();toggle()}
    else if(e.key==="ArrowRight"){if(e.shiftKey)next(false);else a.currentTime=Math.min(a.duration||0,a.currentTime+10)}
    else if(e.key==="ArrowLeft"){if(e.shiftKey)prev();else a.currentTime=Math.max(0,a.currentTime-10)}
  });

  ["dragenter","dragover"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();document.body.classList.add("drag")})});
  ["dragleave","drop"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();document.body.classList.remove("drag")})});
  document.addEventListener("drop",function(e){if(e.dataTransfer&&e.dataTransfer.files)add(e.dataTransfer.files)});

  if("mediaSession" in navigator){
    var ms=navigator.mediaSession;
    ms.setActionHandler("play",toggle);ms.setActionHandler("pause",toggle);
    ms.setActionHandler("previoustrack",prev);ms.setActionHandler("nexttrack",function(){next(false)});
  }

  $("theme").onclick=function(){
    var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    r.dataset.theme=dark?"light":"dark";
  };
  fill($("seek"));render();
})();
</script>
</body>
</html>
